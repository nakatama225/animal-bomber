[project]
name = "animal-bomber-server"
version = "0.2.0"
description = "どうぶつボンバー LAN対戦の中継サーバ（静的配信 + WebSocket 中継、同一ポート）"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animal_bomber_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
