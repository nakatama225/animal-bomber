<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>どうぶつボンバー</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 試合の前の画面（タイトル・キャラ選び・ルール・設定とマニュアルと更新履歴）と、通信対戦のロビー。中身はスクリプトが組み立てる -->
      <section id="menu"></section>

      <!-- 試合の画面 -->
      <section id="play" hidden>
        <div class="stage">
          <div class="board">
            <canvas id="stage" width="920" height="680"></canvas>
            <!-- 盤面に重ねるもの。ラウンドの間の幕・短い通知・ポーズの表示 -->
            <div id="banner" class="banner" hidden></div>
            <div id="toasts" class="toasts"></div>
            <div id="pause" class="pause" hidden>ポーズ中（P で再開）</div>
          </div>
          <aside class="side">
            <div id="side-panel"></div>
            <!-- 通信対戦の、接続の様子。高さを固定して、文が出たり消えたりしても板が上下に動かないようにする -->
            <p id="lan-status" class="lan-status" hidden></p>
            <div id="toolbar" class="toolbar"></div>
          </aside>
        </div>
      </section>
    </div>

    <!-- 起動の幕。全面を覆うので #app の外に置く（原型と同じ）。中身はスクリプトが組み立て、出すときだけ hidden を外す -->
    <div id="splash" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
